services:
  - type: web
    name: cba-controle-avarias
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: cba-db
          property: connectionString
      - key: FLASK_ENV
        value: production

databases:
  - name: cba-db
    plan: free
    databaseName: cba
    user: cba_user
    region: ohio
