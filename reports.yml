name: CBA scheduled report runner
on:
  schedule:
    - cron: '0 11 * * *' # 11:00 UTC; requires GitHub repo Actions scheduling to remain enabled
  workflow_dispatch:
jobs:
  reports:
    runs-on: ubuntu-latest
    env:
      REPORT_JOB_TOKEN: ${{ secrets.CBA_REPORT_JOB_TOKEN }}
    steps:
      - name: Trigger protected Render job
        if: ${{ env.REPORT_JOB_TOKEN != '' }}
        run: |
          curl --fail --silent --show-error --max-time 90 --retry 2 \
            -X POST 'https://cba-controle-avarias.onrender.com/jobs/reports/run' \
            -H "Authorization: Bearer ${REPORT_JOB_TOKEN}"
      - name: Missing secret notice
        if: ${{ env.REPORT_JOB_TOKEN == '' }}
        run: echo 'Configure Actions secret CBA_REPORT_JOB_TOKEN and matching Render REPORT_JOB_TOKEN to enable automatic reports.'
